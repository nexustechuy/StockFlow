<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>StockFlow - Productos</title>

  <!-- Estilos Bootstrap -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" />

  <!-- Íconos de Bootstrap -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css" />

  <!-- Estilos Propios -->
  <link rel="stylesheet" href="../CSS/styles-paginas/productosRepositor.css">
  <link rel="stylesheet" href="../CSS/componentes/cards.css">

</head>

<body>

  <aside class="sidebar">

    <div class="sidebar-brand">StockFlow</div>

    <div class="sidebar-usuario">
      Repositor
      <span>Juan Pérez</span>
    </div>

    <nav>
      <a href="dashboardRepositor.html">
        <i class="bi bi-grid me-2"></i>Dashboard
      </a>
      <a href="productosRepositor.html" class="activo">
        <i class="bi bi-box-seam me-2"></i>Productos
      </a>
      <a href="reposicionesRepositor.html">
        <i class="bi bi-arrow-repeat me-2"></i>Reposiciones
      </a>
      <a href="alertasStockRepositor.html">
        <i class="bi bi-exclamation-triangle me-2"></i>Alertas de Stock
      </a>
      <a href="#">
        <i class="bi bi-gear me-2"></i>Ajustes
      </a>
    </nav>

    <div class="sidebar-footer">
      <a href="login.html">
        <i class="bi bi-box-arrow-left me-2"></i>Cerrar sesión
      </a>
    </div>

  </aside>

  <!-- CONTENIDO PRINCIPAL -->
  <main class="contenido">

    <!-- Encabezado -->
    <div class="encabezado">
      <h2>Productos</h2>
      <p>Consultá la disponibilidad y el stock de los productos</p>
    </div>

    <!-- Buscador de productos -->
    <div class="buscador-productos">
      <input type="text" class="input-busqueda" id="buscadorProductos" placeholder="Buscá un producto...">
    </div>

    <!-- Filtros -->
    <div class="filtros-productos">
      <button type="button" class="filtro-chip activo" data-filtro="todos">Todos</button>
      <button type="button" class="filtro-chip" data-filtro="disponible">Disponible</button>
      <button type="button" class="filtro-chip" data-filtro="bajo">Stock bajo</button>
      <button type="button" class="filtro-chip" data-filtro="sinstock">Sin stock</button>
    </div>

    <!-- Tabla de productos -->
    <section class="panel">
      <table class="tabla-productos tabla-fija" id="tablaProductos">
        <thead>
          <tr>
            <th>Producto</th>
            <th>Categoría</th>
            <th>Stock</th>
            <th>Mínimo</th>
            <th>Estado</th>
            <th>Acción</th>
          </tr>
        </thead>
        <tbody id="cuerpoTablaProductos">
        </tbody>
      </table>
      <p class="sin-resultados" id="sinResultadosProductos" style="display:none;">No se encontraron productos.</p>
    </section>

  </main>

  <!-- JS BOOTSTRAP -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

  <!-- JS PROPIO -->
  <script src="../js/componentes/menu-responsive.js"></script>
  <script src="../js/js-paginas/navRepositor.js"></script>
  <script src="../js/js-paginas/productosRepositor.js"></script>

</body>

</html>
