<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Inicio de sesión</title>

  <!-- Estilos Bootstrap -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet" />

  <!-- Bootstrap Icons -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

  <!-- Estilos propios -->
  <link rel="stylesheet" href="/css/styles-paginas/login.css">
</head>

<body>
  <script src="/js/componentes/tema.js"></script>
  <div class="card-login">
    <h1 class="titulo">StockFlow</h1>

    <form id="form-login" novalidate>
      <label for="correo">Correo</label>
      <input type="email" id="correo" name="correo" placeholder="juan@gmail.com" maxlength="50" required />
      <label for="contrasena">Contraseña</label>

      <div class="contenedor-contrasena">
        <input type="password" id="contrasena" name="contrasena" placeholder="••••••••" maxlength="16" required />

        <button type="button" id="mostrarContrasena" aria-label="Mostrar contraseña" title="Mostrar contraseña">
          <i class="bi bi-eye"></i>
        </button>
      </div>

      <div class="links-form">
        <a href="#" data-bs-toggle="modal" data-bs-target="#modalRecuperarContrasena">
          ¿Olvidaste tu contraseña?
        </a>
      </div>

      <div id="error" class="mensaje-error" style="display: none;"></div>

      <button type="submit" class="btn-ingresar">Ingresar</button>
    </form>

    <!-- Idioma -->
    <div class="idioma-login">
      <label for="idiomaLogin">Idioma / Language</label>
      <div class="dropdown">
        <button type="button" id="idiomaLogin" class="btn-idioma" data-bs-toggle="dropdown" aria-expanded="false">
          <i class="bi bi-globe"></i>
          <span id="idiomaLoginTexto">Español</span>
          <i class="bi bi-chevron-down"></i>
        </button>
        <ul class="dropdown-menu dropdown-menu-end">
          <li><button type="button" class="dropdown-item" data-idioma="es">Español</button></li>
          <li><button type="button" class="dropdown-item" data-idioma="en">English</button></li>
        </ul>
      </div>
    </div>
  </div>

  <!-- Modal: Recuperar contraseña -->
  <div class="modal fade modal-stockflow" id="modalRecuperarContrasena" tabindex="-1"
    aria-labelledby="modalRecuperarContrasenaLabel" aria-hidden="true">

    <div class="modal-dialog modal-dialog-centered">
      <div class="modal-content">

        <div class="modal-header">
          <h1 class="modal-title" id="modalRecuperarContrasenaLabel">
            Recuperar contraseña
          </h1>

          <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Cerrar">
          </button>
        </div>

        <div class="modal-body">
          <p class="texto-recuperar">
            Comunicate con el administrador del sistema.
            Él te va a asignar una nueva contraseña para que puedas volver a ingresar.
          </p>
        </div>

        <div class="modal-footer">
          <button type="button" class="btn-primario" data-bs-dismiss="modal">
            Entendido
          </button>
        </div>

      </div>
    </div>
  </div>

  <!-- Modal: Elegir rol (usuarios con más de un rol) -->
  <div class="modal fade modal-stockflow" id="modalElegirRol" tabindex="-1"
    aria-labelledby="modalElegirRolLabel" aria-hidden="true">

    <div class="modal-dialog modal-dialog-centered">
      <div class="modal-content">

        <div class="modal-header">
          <h1 class="modal-title" id="modalElegirRolLabel">
            ¿Con qué rol querés ingresar?
          </h1>

          <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Cerrar">
          </button>
        </div>

        <div class="modal-body">
          <div class="lista-roles" id="listaElegirRol"></div>
          <div id="errorElegirRol" class="mensaje-error" style="display: none;"></div>
        </div>

        <div class="modal-footer">
          <button type="button" class="btn-primario" id="btnConfirmarRol">
            Ingresar
          </button>
        </div>

      </div>
    </div>
  </div>

  <!-- JS Bootstrap -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

  <!-- JS propio -->
  <script src="/js/js-paginas/script-login.js" defer></script>
  <script src="/js/idioma.js"></script>

</body>

</html>
