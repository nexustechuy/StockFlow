<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Inicio de sesión</title>


  <!-- Estilos Bootstrap-->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet" />

  <!--Estilos Propios-->
  <link rel="stylesheet" href="/css/styles-paginas/login.css">

</head>

<body>
  <div class="card-login">
    <h1 class="titulo">StockFlow</h1>

    <form id="form-login" novalidate>
      <label for="correo">Correo</label>
      <input type="email" id="correo" name="correo" placeholder="juan@gmail.com" required />

      <label for="contrasena">Contraseña</label>
      <input type="password" id="contrasena" name="contrasena" placeholder="••••••••" required />

      <div class="links-form">
        <a href="#" data-bs-toggle="modal" data-bs-target="#modalRecuperarContrasena">¿Olvidaste tu contraseña?</a>
      </div>

      <div id="error" class="mensaje-error" style="display: none;"></div>

      <button type="submit" class="btn-ingresar">Ingresar</button>
    </form>
  </div>

  <!-- MODAL RECUPERAR CONTRASEÑA -->
  <div class="modal fade modal-stockflow" id="modalRecuperarContrasena" tabindex="-1"
    aria-labelledby="modalRecuperarContrasenaLabel" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered">
      <div class="modal-content">
        <div class="modal-header">
          <h1 class="modal-title" id="modalRecuperarContrasenaLabel">Recuperar contraseña</h1>
          <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Cerrar"></button>
        </div>

        <form id="formRecuperarContrasena" novalidate>
          <div class="modal-body">

            <div id="exitoRecuperacion" class="mensaje-exito" style="display: none;"></div>

            <div class="campo-formulario">
              <label for="emailRecuperacion">Email <span class="obligatorio">*</span></label>
              <input type="email" id="emailRecuperacion" name="email" placeholder="juan@gmail.com" required>
              <span class="error-campo"></span>
            </div>

          </div>

          <div class="modal-footer">
            <button type="submit" class="btn-primario">Cambiar contraseña</button>
          </div>
        </form>

      </div>
    </div>
  </div>

  <!-- JS BOOTSTRAP -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

  <!--JS PROPIO-->
  <script src="/js/componentes/tema.js"></script>
  <script src="/js/js-paginas/script-login.js" defer></script>

</body>

</html>
