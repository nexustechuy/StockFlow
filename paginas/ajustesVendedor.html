<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>StockFlow - Ajustes</title>

  <!-- Estilos Bootstrap -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" />

  <!-- Íconos de Bootstrap -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css" />

  <!-- Estilos Propios -->
  <link rel="stylesheet" href="/css/styles-paginas/ajustes.css">

    <script src="/js/componentes/sesion.js"></script>
</head>

<body>

  <aside class="sidebar">

    <div class="sidebar-brand">StockFlow</div>

    <div class="sidebar-usuario">
      Vendedor
      <span data-nombre-usuario></span>
    </div>

    <nav>
      <a href="dashboardVendedor.html">
        <i class="bi bi-grid me-2"></i>Dashboard
      </a>
      <a href="registrarVentaVendedor.html">
        <i class="bi bi-cart-plus me-2"></i>Registrar venta
      </a>
      <a href="productosVendedor.html">
        <i class="bi bi-box-seam me-2"></i>Productos
      </a>
      <a href="historialVendedor.html">
        <i class="bi bi-clock-history me-2"></i>Historial
      </a>
      <a href="ajustesVendedor.html" class="activo">
        <i class="bi bi-gear me-2"></i>Ajustes
      </a>
    </nav>

    <div class="sidebar-footer">
      <a href="login.html">
        <i class="bi bi-box-arrow-left me-2"></i>Cerrar sesión
      </a>
    </div>

  </aside>

  <!-- CONTENIDO PRINCIPAL -->
  <main class="contenido">

    <!-- Encabezado -->
    <div class="encabezado">
      <h2>Ajustes</h2>
      <p>Personalizá tu cuenta y preferencias</p>
    </div>

    <!-- Tema -->
    <section class="panel">
      <h5>Tema</h5>
      <div class="opciones-ajuste">
        <button type="button" class="filtro-chip activo" data-tema="claro">
          <i class="bi bi-sun me-2"></i>Modo claro
        </button>
        <button type="button" class="filtro-chip" data-tema="oscuro">
          <i class="bi bi-moon me-2"></i>Modo oscuro
        </button>
      </div>
    </section>

    <!-- Idioma -->
    <section class="panel">
      <h5>Idioma</h5>
      <div class="opciones-ajuste">
        <button type="button" class="filtro-chip activo" data-idioma="es">Español</button>
        <button type="button" class="filtro-chip" data-idioma="en">English</button>
      </div>
    </section>

  </main>

  <!-- JS BOOTSTRAP -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

  <!-- JS PROPIO -->
  <script src="/js/componentes/tema.js"></script>
  <script src="/js/componentes/menu-responsive.js"></script>
  <script src="/js/js-paginas/navVendedor.js"></script>
  <script src="/js/js-paginas/ajustes.js"></script>

</body>

</html>
