
<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>StockFlow - Ajustes</title>

  <!-- Estilos Bootstrap -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" />

  <!-- Íconos de Bootstrap -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css" />

  <!-- Estilos propios -->
  <link rel="stylesheet" href="/css/styles-paginas/ajustes.css">

  <!-- Control de sesión -->
  <script src="/js/componentes/sesion.js"></script>
</head>

<body>

  <!-- MENÚ LATERAL -->
  <aside class="sidebar">

    <div class="sidebar-brand">StockFlow</div>

    <div class="sidebar-usuario">
      <span data-i18n="Administrador">Administrador</span>
      <span data-nombre-usuario></span>
    </div>

    <nav>
      <a href="dashboardAdministrador.html">
        <i class="bi bi-grid me-2"></i>
        <span data-i18n="Dashboard">Dashboard</span>
      </a>

      <a href="ventasAdministrador.html">
        <i class="bi bi-cart-check me-2"></i>
        <span data-i18n="Ventas">Ventas</span>
      </a>

      <a href="inventarioAdministrador.html">
        <i class="bi bi-box-seam me-2"></i>
        <span data-i18n="Inventario">Inventario</span>
      </a>

      <a href="gananciasAdministrador.html">
        <i class="bi bi-graph-up-arrow me-2"></i>
        <span data-i18n="Ganancias">Ganancias</span>
      </a>

      <a href="usuariosAdministrador.html">
        <i class="bi bi-people me-2"></i>
        <span data-i18n="Usuarios">Usuarios</span>
      </a>

      <a href="ajustesAdministrador.html" class="activo">
        <i class="bi bi-gear me-2"></i>
        <span data-i18n="Ajustes">Ajustes</span>
      </a>
    </nav>

    <!-- CERRAR SESIÓN -->
    <div class="sidebar-footer">
      <a href="login.html">
        <i class="bi bi-box-arrow-left me-2"></i>
        <span data-i18n="Cerrar sesión">Cerrar sesión</span>
      </a>
    </div>

  </aside>

  <!-- CONTENIDO PRINCIPAL -->
  <main class="contenido">

    <!-- ENCABEZADO -->
    <div class="encabezado">
      <h2 data-i18n="Ajustes">Ajustes</h2>

      <p data-i18n="Personalizá tu cuenta y preferencias">
        Personalizá tu cuenta y preferencias
      </p>
    </div>

    <!-- TEMA -->
    <section class="panel">

      <h5 data-i18n="Tema">Tema</h5>

      <div class="opciones-ajuste">

        <button type="button" class="filtro-chip activo" data-tema="claro">
          <i class="bi bi-sun me-2"></i>
          <span data-i18n="Modo claro">Modo claro</span>
        </button>

        <button type="button" class="filtro-chip" data-tema="oscuro">
          <i class="bi bi-moon me-2"></i>
          <span data-i18n="Modo oscuro">Modo oscuro</span>
        </button>

      </div>

    </section>

    <!-- IDIOMA -->
    <section class="panel">

      <h5 data-i18n="Idioma">Idioma</h5>

      <div class="opciones-ajuste">

        <button
          type="button"
          class="filtro-chip activo"
          data-idioma="es"
          style="position: relative; z-index: 9999; pointer-events: auto; cursor: pointer;"
        >
          <span data-i18n="Español">Español</span>
        </button>

        <button
          type="button"
          class="filtro-chip"
          data-idioma="en"
          style="position: relative; z-index: 9999; pointer-events: auto; cursor: pointer;"
        >
          <span data-i18n="Inglés">Inglés</span>
        </button>

      </div>

    </section>

  </main>

  <!-- SCRIPTS -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
  <script src="/js/componentes/tema.js"></script>
  <script src="/js/componentes/menu-responsive.js"></script>
  <script src="/js/js-paginas/navAdministrador.js"></script>
  <script src="/js/idioma.js"></script>
  <script src="/js/js-paginas/ajustes.js"></script>

</body>

</html>
